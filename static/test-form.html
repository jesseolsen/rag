<!DOCTYPE html>
<html>
<head>
    <title>Test Job Application Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <h1>Test Job Application Form</h1>
    <p>Try clicking the bookmarklet to fill these fields:</p>
    <form>
        <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="name" placeholder="Enter your full name">
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="text" id="email" name="email" placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" placeholder="Enter your phone">
        </div>
        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" placeholder="City, State">
        </div>
        <div class="form-group">
            <label for="summary">Professional Summary</label>
            <textarea id="summary" name="about" placeholder="Tell us about yourself..."></textarea>
        </div>
        <div class="form-group">
            <label for="skills">Skills</label>
            <textarea id="skills" name="skills" placeholder="List your skills..."></textarea>
        </div>
        <div class="form-group">
            <label for="experience">Work Experience</label>
            <textarea id="experience" name="experience" placeholder="Describe your work experience..."></textarea>
        </div>
        <div class="form-group">
            <label for="education">Education</label>
            <input type="text" id="education" name="education" placeholder="Your degree and school">
        </div>
    </form>
</body>
</html>
