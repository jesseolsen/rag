version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15-latest
    container_name: resume_rag_postgres
    environment:
      POSTGRES_DB: resume_rag
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: resume_rag_api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/resume_rag
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
